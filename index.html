<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voxel City</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.165.0",
            "three/addons/": "https://esm.sh/three@0.165.0/examples/jsm/",
            "nipplejs": "https://esm.sh/nipplejs@0.10.1",
            "peerjs": "https://esm.sh/peerjs@1.5.4",
            "qrcode": "https://esm.sh/qrcode@1.5.3"
        }
    }
    </script>
</head>
<body>
    <div id="joystick-container"></div>
    <div id="crosshair">+</div>

    <div id="ui-container">
        <button id="connect-btn">Connect</button>
    </div>

    <div id="modal-backdrop" class="hidden">
        <div id="modal-content">
            <h2>Connect with a Peer</h2>
            <p>Your ID:</p>
            <b id="my-peer-id">Loading...</b>
            <div id="qrcode"></div>
            <p>Enter a peer's ID to connect:</p>
            <input type="text" id="peer-id-input" placeholder="Peer ID">
            <button id="connect-to-peer-btn">Connect</button>
            <button id="close-modal-btn">Close</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
